name: Deploy site to GitHub Pages

on:
  # Publica a cada push na branch principal (main)
  push:
    branches: [main]
  # Permite rodar manualmente pela aba "Actions"
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que apenas um deploy rode por vez
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build com Astro
        uses: withastro/action@v3
        # A action detecta o gerenciador de pacotes, instala, roda o build
        # e envia o resultado (pasta dist) como artefato do Pages.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
